# Claude Code telemetry 的收集端：all-in-one Jaeger（v2），收 OTLP traces。
#
# 為什麼是 Jaeger 而不是 console exporter：console 會在 session 結束時把整包 telemetry
# 倒進終端機，而且寫的是 stdout，跟 `claude -p` 的輸出混在一起。OTLP 完全不碰終端機，
# Jaeger 還原生把 trace 畫成時間瀑布（互動 → subagent → tool/llm span）。
#
# v2（jaegertracing/jaeger）吃設定檔——見 jaeger-config.yaml。v1 已於 2025-12-31 EOL，
# 舊的 SPAN_STORAGE_TYPE / BADGER_* 環境變數在 v2 完全無效。儲存用內嵌的 badger，
# 放在 named volume，重啟不掉資料，多場審查會持續累積。
#
# ## 網路的規約：**Jaeger 只擁有自己那張，由需要它的人把它接過去**
#
# 送 trace 的容器必須跟 Jaeger 在同一張 network 上（容器內用 http://jaeger:4317 直達，
# 防火牆的「放行直連網段」自動涵蓋，iptables 一行都不用動）。達成的方向有兩種，這裡
# 選的是後者：
#
#   · ✗ Jaeger 去借別人的網（`external: true`）——那張網必須**先存在**，於是就有了
#     開機順序：先起對方、再起 Jaeger，反過來就 `network not found`。而且它只借得到
#     **一張**，送 trace 的人一多就不夠用。
#   · ✓ Jaeger 建自己的網，**誰要送 trace，誰負責 `docker network connect jaeger <自己的網>`**。
#     一顆容器可以同時掛多張網，接上去不影響它原本那張。沒有開機順序，張數也沒有上限。
#
# 兩條路徑都照這條規約做：
#   · claude-pty  — 控制平面把 Jaeger 接到**每一張使用者網路**上（server/user_proxy.py
#     的 `attach_jaeger`；每個使用者一張網，ADR 0016）
#   · dev-container — run wrapper 把 Jaeger 接到 gitlab-proxy 那張網上再開容器
#     （`dev-container/run-ncr-dev-container.sh` 的 telemetry 區塊）
#
# ⚠ 兩邊都必須在**容器啟動之前**接好。限制模式的防火牆放行的是 entrypoint 起跑那一刻的
#   直連網段快照，之後才接上的網路封包會被 REJECT，而且永遠不會好。
#
# 啟動:  docker compose -f opentelemetry/jaeger-compose.yaml up -d
# UI:    http://localhost:16686（搜 service = "claude-code"）
# 停止:  docker compose -f opentelemetry/jaeger-compose.yaml down（資料留在 volume）

services:
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    container_name: jaeger
    command: ["--config=/etc/jaeger/config.yaml"]
    user: "0:0"            # badger 要在 root 擁有的 named volume 裡 mkdir
    restart: unless-stopped
    # 發佈的 port 只綁 loopback：本機連得到、外面連不到。Jaeger 沒有內建認證，
    # loopback 綁定就是它的存取控制。容器對容器走 docker network（jaeger:4317），不經這裡。
    ports:
      - "127.0.0.1:16686:16686"   # UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC（host 上直接跑 claude 時指 localhost:4317）
      - "127.0.0.1:4318:4318"     # OTLP HTTP
    volumes:
      - ./jaeger-config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-badger:/badger
    # 沒有 healthcheck 的話，badger 目錄壞掉會讓 jaeger_query 卡死在啟動階段，
    # `docker ps` 卻照樣報 Up——而 OTLP 是 fail-open，4317 沒人聽等於 telemetry 靜默消失。
    # healthcheckv2 在 collector 完全就緒前回 503，抓的正是這個狀態。
    # 變 unhealthy 時的復原：down → `docker volume rm jaeger-badger` → up -d
    #（會失去既存 trace）。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:13133/status"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      # 只掛自己這一張。**送 trace 的那一方會把 jaeger 接到他自己的網上**（見檔頭的
      # 網路規約），所以這裡不需要、也不應該去引用任何別人的網路。
      - trace

volumes:
  jaeger-badger:
    # 釘死 volume 名，脫離「compose 專案目錄」前綴——不釘的話搬一次目錄就會
    # 悄悄換一顆新 volume，歷史 trace 全部留在舊顆裡沒人知道。
    name: jaeger-badger

networks:
  trace:
    # **擁有，不借用**（見檔頭）。compose 會自己建，不需要任何東西先存在。
    # ⚠ 釘死名字，理由同上面的 volume：不釘的話會被冠上 compose 專案目錄前綴，
    #   搬一次目錄就換一張網，而要接上來的那兩方都是照名字找的。
    name: ncr-telemetry
