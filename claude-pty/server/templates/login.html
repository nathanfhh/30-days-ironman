{% extends "base.html" %}
{% block title %}登入 · claude-pty{% endblock %}

{% block body %}
<main class="gate">
  <aside class="gate__aside">
    <div class="gate__brand">
      <p class="gate__kicker">控制平台</p>
      <h1 class="gate__mark" data-testid="brand-mark">claude<em>-pty</em></h1>
    </div>
    {% if art %}
    <!-- 插畫是氣氛，不是資訊：aria-hidden 讓螢幕閱讀器直接跳過，別唸一段沒有意義的描述 -->
    <img class="gate__art" aria-hidden="true" alt=""
         src="{{ url_for('static', filename='images/' ~ art) }}">
    {% endif %}
  </aside>

  <section class="gate__main">
    <form class="gate__form" id="login-form" autocomplete="on">
      <!-- 標題就該長得像標題：顯示字體 + 一道強調色短線，而不是跟欄位標籤同一個字級 -->
      <h2 class="gate__heading">身分驗證</h2>

      <div class="notice" data-tone="error" id="login-error" data-testid="login-error" hidden></div>

      <div class="field">
        <label class="label label--field" for="username">使用者名稱</label>
        <input class="input" id="username" name="username" data-testid="login-username"
               autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label class="label label--field" for="password">密碼</label>
        <input class="input" id="password" name="password" type="password" data-testid="login-password"
               autocomplete="current-password" required>
      </div>

      <button class="btn btn--primary" type="submit" id="login-btn" disabled
              style="width:100%; padding:var(--space-3)">
        <i class="fa-solid fa-right-to-bracket"></i> 進入控制台
      </button>
    </form>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script>
  // 送出鈕要等兩欄都填才可按——省掉一次注定失敗的往返。
  // ⚠ 這裡**刻意不檢查密碼長度**：長度是「建立/變更密碼」時的政策，不是登入條件。
  //   把它搬到登入頁的話，只要哪天調高了 MIN_PASSWORD_LENGTH，所有在舊政策下建立的
  //   帳號就再也按不下這顆按鈕——而後端明明還驗得過他們的密碼。
  const userField = document.getElementById("username");
  const passField = document.getElementById("password");
  const loginBtn = document.getElementById("login-btn");

  function validateLogin() {
    loginBtn.disabled = !(userField.value.trim() && passField.value);
  }
  [userField, passField].forEach((el) => el.addEventListener("input", validateLogin));
  validateLogin();   // 瀏覽器自動填入時值已經在，不能只等 input 事件

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("login-error");
    err.hidden = true;
    try {
      await api("/api/auth/login", {
        method: "POST",
        body: {
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        },
      });
      // 換頁會把當下的 toast 一起帶走，所以寄放給下一頁顯示（見 app.js 的 toastAfterNav）
      toastAfterNav(`歡迎回來，${userField.value.trim()}`, "success", "已進入控制台");
      location.href = "/";
    } catch (ex) {
      err.textContent = ex.message;
      err.hidden = false;
    }
  });
</script>
{% endblock %}
