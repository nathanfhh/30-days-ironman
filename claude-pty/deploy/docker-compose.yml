# claude-pty 容器化部署（ADR 0009）。以下指令的 cwd 都是本檔所在的 deploy/。
#
# ⚠ **不要直接 `docker compose up -d --build`**：reconciler 共用 control 的 PID namespace，
#   control 一停它就被連坐 SIGKILL，compose 接著要停一個已經死掉的容器有機會中止整個 up
#   （留下殘留容器與 502）。一律走這支，它會先把 reconciler 收乾淨：
#     ./redeploy.sh
#
# 設定檔：從 .env.example 複製成 .env 再填（SECRET_KEY / HOST_REPO_ROOT / DOCKER_GID /
# APP_UID）。完整步驟見 README 的「部署」一節。
#
# 憑證不在部署層：每個人登入網頁後，把自己 `claude setup-token` 的輸出貼到帳號管理頁
# （加密存 DB、開場時交給 session——**預設走檔案描述符，不進容器的環境變數**，見 README
# 的「憑證」一節）。host 上不需要準備任何憑證檔。
#
# 建立第一個管理員（容器起來後）：
#   docker compose exec control python -m server.cli create-admin alice

name: claude-pty

# --- GitLab 代理的設定（ADR 0016）---------------------------------------------------
#
# ⚠ **compose 讀 `.env` 只是為了做 `${VAR}` 插值，不會把任何東西注進容器。** 所以
#   `.env` 填了 `CLAUDE_PTY_GITLAB_HOST` 而這裡沒有對應的一行，容器裡就是**沒有**那個
#   變數，`config.gitlab_enabled()` 恆為 False——整套 GitLab 代理在容器化部署下完全不
#   存在，而畫面上唯一的症狀是「帳號頁沒有 PAT 面板」。2026-08-07 盤點時發現這十個變數
#   一個都沒接（`grep GITLAB deploy/` 零命中），是使用者自己問「PAT 面板在哪」才浮出來的。
#
# ⚠ **用 anchor 而不是在兩隻服務各抄一份。** control 與 reconciler 都要，而且
#   **reconciler 漏掉更糟**：它是收斂代理的那一邊，看不到 GITLAB_HOST 會把每一顆代理
#   判成「該收」，於是代理被建起來、下一輪被收掉、再被建起來。抄兩份遲早會漂——同一份
#   檔案裡已經有過一次（下面 TTYD_RUST_* 那段記著那次）。
x-gitlab-env: &gitlab-env
  # 總開關：填了主機名才啟用（不含 https:// 與結尾斜線）。空的＝整套不存在。
  CLAUDE_PTY_GITLAB_HOST: ${CLAUDE_PTY_GITLAB_HOST:-}
  # git over SSH 的主機名，只用於 URL 改寫。多數部署與上面同一個，不填就沿用。
  CLAUDE_PTY_GITLAB_SSH_HOST: ${CLAUDE_PTY_GITLAB_SSH_HOST:-}
  # session 在自己網路上找代理的名字與埠（＝容器裡看到的 API base）。
  CLAUDE_PTY_GITLAB_PROXY_ALIAS: ${CLAUDE_PTY_GITLAB_PROXY_ALIAS:-}
  CLAUDE_PTY_GITLAB_PROXY_PORT: ${CLAUDE_PTY_GITLAB_PROXY_PORT:-5678}
  # 代理容器的 image 與資源上限。
  CLAUDE_PTY_GITLAB_PROXY_IMAGE: ${CLAUDE_PTY_GITLAB_PROXY_IMAGE:-}
  CLAUDE_PTY_GITLAB_PROXY_MEM_LIMIT: ${CLAUDE_PTY_GITLAB_PROXY_MEM_LIMIT:-128m}
  CLAUDE_PTY_GITLAB_PROXY_PIDS_LIMIT: ${CLAUDE_PTY_GITLAB_PROXY_PIDS_LIMIT:-64}
  # 逃生口：讓代理的 /etc/hosts 多幾筆（`name:ip`，逗號分隔）。預設空的。
  # ⚠ 這是一個能讓代理指向任意主機的旋鈕，設錯就是把所有人的 PAT 送到別的地方。
  CLAUDE_PTY_GITLAB_PROXY_EXTRA_HOSTS: ${CLAUDE_PTY_GITLAB_PROXY_EXTRA_HOSTS:-}
  # PAT 長度上限（貼錯東西時在入口就回 400）。
  CLAUDE_PTY_GITLAB_PAT_MAX: ${CLAUDE_PTY_GITLAB_PAT_MAX:-512}
  # 代理連續幾輪起不來才把錯誤端到畫面上（不是 1：偶爾重啟一輪是正常的）。
  CLAUDE_PTY_GITLAB_PROXY_FAIL_THRESHOLD: ${CLAUDE_PTY_GITLAB_PROXY_FAIL_THRESHOLD:-3}
  # 內部 CA 簽的 GitLab：那份 CA（PEM）在 host 上的絕對路徑，唯讀掛進每一顆代理。
  # 空的＝用容器內的系統 CA（維持現狀）。
  # ⚠ **reconciler 也必須看得到這兩個。** 判斷「這顆代理掛的 CA 與現在的設定不一樣、
  #   要重建」是它做的——CA 是 bind mount，掛載換不掉，熱重載救不了。漏給 reconciler
  #   就是「改了 CA 卻永遠沒有作用」，而症狀是每個請求 502、代理狀態卻是綠的。
  CLAUDE_PTY_GITLAB_CA_FILE: ${CLAUDE_PTY_GITLAB_CA_FILE:-}
  # 控制平面自己看得到的同一個檔（存在性檢查與內容比對用）。不設就等於上面那個。
  CLAUDE_PTY_GITLAB_CA_FILE_SELF: ${CLAUDE_PTY_GITLAB_CA_FILE_SELF:-}

services:
  control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 容器內 app 使用者的 uid。**必須等於 host 上那些掛進來的檔案的擁有者**：
        # ./data（SQLite）的擁有者要是這個 uid 才寫得進去；per-user 空間同理。
        # 查法：`id -u`（Docker Desktop 走 VM 的 uid 對映，維持預設 1000 即可）。
        APP_UID: ${APP_UID:-1000}
        # 這一版是哪個 commit（頁尾顯示用）。由 deploy/redeploy.sh 算好 export 進來
        # ——容器裡沒有 .git 也沒有 git，執行期問不到。沒設就是空的，頁尾會誠實
        # 顯示「commit 未知」而不是猜一個。
        GIT_SHA: ${GIT_SHA:-}
        BUILT_AT: ${BUILT_AT:-}
        # Rust 版 ttyd 的來源與釘住的 commit。
        # ⚠ **這裡刻意不給預設值**（冒號後面留空＝環境有設才傳、沒設就不要傳），讓
        #   Dockerfile 的 ARG 成為唯一的釘點。原本這裡也寫了一份預設，於是：
        #     1. 改了 Dockerfile 卻被這裡蓋回去，build 出來還是舊的那顆；
        #     2. reconciler **沒有**這兩行，等於兩個服務用不同的 commit 建同一份 Dockerfile。
        #   兩個症狀在畫面上都完全看不出來（2026-07-27 實測踩到）。
        #   臨時換版在 .env 設 TTYD_RUST_REF；正式換版請改 deploy/Dockerfile 那一行。
        TTYD_RUST_REPO:
        TTYD_RUST_REF:
    # ⚠ 掛 docker socket ≈ 給此容器 host root（ADR 0009 已明確接受）。控制平面本來就必須
    #   有建立容器的權力，容器化買到的是部署一致性，**不是安全邊界**——不可在此容器內
    #   執行任何不受信任的程式碼。降風險的實質手段是改用 rootless Docker。
    # 非 root 執行（USER app 寫在 Dockerfile）。socket 是 srw-rw---- root:root，非 root
    # 要讀它就得屬於該 gid：macOS Docker Desktop 是 0，Linux 多半是 docker 群組，用
    #   DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) docker compose up -d
    # 覆寫。這不會讓「掛 socket ≈ host root」這件事消失（ADR 0009），只是縱深防禦。
    group_add: ["${DOCKER_GID:-0}"]
    # tini 當 PID 1：ttyd 以 double-fork 起後會 reparent 給 PID 1，而容器內 PID 1 預設是
    # python（不會 reap 孤兒）→ ttyd 結束後變殭屍累積。init: true 讓 docker 注入 tini 負責 reap。
    init: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 注意：compose 的相對路徑以本檔所在目錄為基準，deploy/ 的 .. 是 claude-pty，
      # repo 根要再上一層（entrypoint.sh 在 <repo>/dev-container/）。
      - ../..:${HOST_REPO_ROOT:-/repo}:ro
      # ⚠ trivy DB 快取**不掛進控制平面**（ADR 0018）。它是 named volume，而 volume 會在
      #   **掛載時仍為空**的情況下、用該 image 那個路徑的內容與擁有者初始化。控制平面的
      #   image 沒有 /home/nathan/.cache/trivy——掛了而沒寫東西還救得回來，但只要有東西在
      #   root 擁有的狀態下被寫進去，它就**永久**卡在 root:root（實測）。不掛也達得到目的。
      #   控制平面判斷「要不要更新」改看自己寫的時間戳（config.TRIVY_DB_STAMP，在 /data）。
      # semgrep-rules（A4 SAST 軌道的規則 repo）：唯讀，供存在性檢查 + 當 session 的掛載
      # 來源（同一路徑，ADR 0009）。host 上要**自己先 git clone 一份到 $HOME/semgrep-rules**
      # ——不存在時 compose 會以 root 建出空目錄頂替，所以 session 那側驗的是 `.git`
      # 不是 isdir：空殼＝不掛，A4 軌道 gate 不過、自動跳過。
      - ${HOME}/semgrep-rules:${HOME}/semgrep-rules:ro
      # per-user 的 agent 狀態空間（ADR 0014）。**可寫**——控制平面要在裡面建目錄、
      # 寫 .claude.json 種子。host 自己的 ~/.claude 完全不進來：session 的狀態全在這裡。
      # 以同一個路徑掛進來，host 與 self 兩個視角才對得上（見下方 CLAUDE_PTY_SPACE_SELF）。
      - ${CLAUDE_PTY_SPACE:-${HOME}/claude-pty-space}:${CLAUDE_PTY_SPACE:-${HOME}/claude-pty-space}
      # registry（SQLite）的持久化。放在本檔旁邊的 ./data/，不用 named volume——
      # volume 的實體在 Docker VM 內（macOS 上 host 根本看不到），備份、檢查、搬遷都得先
      # 起一個容器把它撈出來。bind mount 之後 `deploy/data/claude-pty.db` 就是那個檔案本身。
      # ⚠ 掛的是**目錄**不是單一檔案：SQLite 走 WAL，執行中會在同一層另外產生
      #   `-wal` 與 `-shm`；只掛檔案的話那兩個會落在容器層，容器一重建就連同未 checkpoint
      #   的交易一起消失。單檔 bind mount 另有 inode 問題（SQLite 重建檔案時 mount 會失聯）。
      # ⚠ host 這一側可用 .env 的 CLAUDE_PTY_DATA_DIR 換位置（見 .env.example）。容器內那
      #   一側**固定 /data**，兩隻服務與 CLAUDE_PTY_DB_PATH 都依賴它。
      - ${CLAUDE_PTY_DATA_DIR:-./data}:/data
    environment:
      # GitLab 代理那十個變數（見檔頭的 x-gitlab-env；兩隻服務都要，不可以只給一邊）
      <<: *gitlab-env
      # --- 路徑解耦：傳給 daemon 的必須是 **host** 路徑（ADR 0009）---
      CLAUDE_PTY_HOST_HOME: ${HOME}
      CLAUDE_PTY_HOST_REPO_ROOT: ${HOST_REPO_ROOT:-/repo}
      # 控制平面「自己」看得到 repo 的路徑（compose 把 repo 掛在同一個路徑）。
      # 不設會讓 entrypoint.sh 的存在性檢查失敗 → 不掛我們的 entrypoint → session 停在
      # 互動選單（2026-07-25 實測踩到）。
      CLAUDE_PTY_SELF_REPO_ROOT: ${HOST_REPO_ROOT:-/repo}
      # 控制平面自己讀寫的檔案放 volume
      CLAUDE_PTY_DB_PATH: /data/claude-pty.db
      CLAUDE_PTY_SECRET_KEY: ${CLAUDE_PTY_SECRET_KEY:?請設定一個穩定的隨機值（多 worker 需共用、跨重啟需不變）}
      # 控制平面自己看到的 semgrep-rules 路徑（存在性檢查用；容器內 $HOME 是 /home/app，
      # 預設值推不出 host 路徑，故必須明講——同 trivy cache 的理由）。
      CLAUDE_PTY_SEMGREP_RULES_SELF: ${HOME}/semgrep-rules
      # per-user 空間：控制平面自己看到的路徑。compose 把它掛在**同一個**路徑上，所以與
      # CLAUDE_PTY_SPACE 同值；分成兩個變數是因為 ADR 0009 的路徑解耦（給 daemon 的與
      # 自己 mkdir 用的可以不同），而不是因為這裡真的會不一樣。
      CLAUDE_PTY_SPACE: ${CLAUDE_PTY_SPACE:-${HOME}/claude-pty-space}
      CLAUDE_PTY_SPACE_SELF: ${CLAUDE_PTY_SPACE:-${HOME}/claude-pty-space}
      # session 容器要用哪一顆 image。**兩隻服務都要，而且必須與 redeploy.sh 的
      # SESSION_IMAGE 同源**：這個變數原本沒有傳進來，於是 redeploy 用 CLAUDE_PTY_IMAGE
      # 做 preflight、build.sh 用它自己的預設、控制平面又用 config.py 的預設——設了自訂
      # tag 的人會得到「檢查一顆、build 另一顆、實際開場用第三顆」，而且三步都不報錯。
      CLAUDE_PTY_IMAGE: ${CLAUDE_PTY_IMAGE:-ncr-dev-container}
      # host 的作業系統（`uname -s`）。**只有 control 需要**——preflight 只在它裡面跑
      # （reconciler 的 main() 只做 init_db）。
      # ⚠ 控制平面在容器裡問不到這件事：`sys.platform` 永遠是 linux，講的是容器不是 host。
      #   它決定 APP_UID 那道檢查要不要喊（只有 Linux 的 bind mount 會原樣帶 uid 過去；
      #   Docker Desktop 在 macOS/Windows 都做對映）。少了它，macOS 上每次啟動都會收到一句
      #   叫你去改 APP_UID 的假警報——而喊狼來了的訊號比沒有訊號更糟。
      # ⚠ redeploy.sh 會自動算好帶進來（shell 環境變數優先於 .env）。用別的方式部署才需要
      #   自己在 .env 填。
      CLAUDE_PTY_HOST_PLATFORM: ${CLAUDE_PTY_HOST_PLATFORM:-}
      # --- ttyd 在本容器內起，nginx 是同網路的兄弟 → 綁 0.0.0.0，port 不發布到 host ---
      CLAUDE_PTY_TTYD_BIND: "0.0.0.0"
      CLAUDE_PTY_TTYD_HOST: control
      CLAUDE_PTY_BEHIND_PROXY: "1"
      CLAUDE_PTY_CONTROL_HOST: "0.0.0.0"
      # ⚠ 傳進來**只為了讓啟動自檢講實話**，控制平面不拿它做任何決定。
      #   nginx 綁哪裡決定了「這個站台從機器外面連不連得到」，而那件事只有 compose
      #   知道；沒有它的話 COOKIE_SECURE 那道提醒對「只綁 loopback 的本機測試」也會喊，
      #   每次啟動都喊一次的提醒最後就沒有人在看了。
      CLAUDE_PTY_BIND_ADDR: ${CLAUDE_PTY_BIND_ADDR:-127.0.0.1}
      # session 列表每頁筆數（前端以後端回報的 limit 為準）
      CLAUDE_PTY_PAGE_SIZE: ${CLAUDE_PTY_PAGE_SIZE:-10}
      # 前端要用哪一版：legacy（Jinja + app.js，預設）或 vue（frontend/ 的 SPA）。
      # ⚠ **只有 control 需要**：nginx 那邊是靠掛哪一個片段決定的（見下方 nginx 的 volumes），
      #   兩者要一起換。reconciler 不畫任何畫面，不必給。
      CLAUDE_PTY_UI: ${CLAUDE_PTY_UI:-legacy}
      # SSH agent 轉發（opt-in，預設關；ADR 0011）。值是 **host 上** agent socket 的路徑，
      # 由 daemon 解讀——控制平面自己不掛也不碰它，只把路徑轉給 daemon。
      # ⚠ 開了就是每個能建立 session 的帳號都拿得到那把 key（沒有租戶隔離）。
      CLAUDE_PTY_SSH_AUTH_SOCK: ${CLAUDE_PTY_SSH_AUTH_SOCK:-}
      # ⚠ 這裡曾經有 `CLAUDE_PTY_NETWORK`（所有 session 共用的那張網）。**它退役了**
      #   ——session 現在住在每個使用者自己的網路上（ADR 0016），由控制平面按需建立，
      #   compose 給不了也不該給。下面的 `networks:` 區塊是**控制平面自己**那張，與
      #   session 無關，不要因為名字像就一起改。
    # ⚠ 預設的 json-file driver **沒有大小上限**。control 每個請求一行 access log、
    #   nginx 也有、reconciler 每 30 秒一輪，三者都 restart: unless-stopped——磁碟被吃滿時
    #   的症狀是 SQLite 寫入失敗，那個症狀完全指不到 log 檔（審查 F-017）。
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [claude-pty-net]
    restart: unless-stopped

  # 對帳器：獨立 process（ADR 0008 階段 5）。與 control 同 image、同設定，只是換啟動命令。
  reconciler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 與 control 同一個 uid：兩隻共用同一份 ./data（SQLite），寫入者不只一個。
        APP_UID: ${APP_UID:-1000}
        # 這一版是哪個 commit（頁尾顯示用）。由 deploy/redeploy.sh 算好 export 進來
        # ——容器裡沒有 .git 也沒有 git，執行期問不到。沒設就是空的，頁尾會誠實
        # 顯示「commit 未知」而不是猜一個。
        GIT_SHA: ${GIT_SHA:-}
        BUILT_AT: ${BUILT_AT:-}
        # ⚠ **這兩行 control 有、這裡也一定要有。** 檔頭第 79 行記著「reconciler 沒有這兩行
        #   ＝兩個服務用不同的 commit 建同一份 Dockerfile」，而當時的修法只拿掉了 control
        #   的預設值、沒有把兩行補過來；第 81 行又明講「臨時換版在 .env 設 TTYD_RUST_REF」。
        #   照做的結果：control 用新 ref、reconciler 用 Dockerfile 預設，Rust stage 編兩次
        #   （五分鐘起跳），而下面那句「與 control 同 image、同設定」不再成立（審查 F-018）。
        TTYD_RUST_REPO:
        TTYD_RUST_REF:
    # ⚠ 共用 control 的 PID namespace：ttyd 跑在 control 容器內，reconciler 若有自己的
    #   namespace，os.kill(pid, 0) 一律看不到那些 pid → 會把還活著的 view 記錄全部誤刪
    #   （2026-07-25 實測）。共用後 pid 可比，_process_alive 才有意義。
    pid: "service:control"
    group_add: ["${DOCKER_GID:-0}"]
    command: ["python", "-m", "server.reconciler"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 注意：compose 的相對路徑以本檔所在目錄為基準，deploy/ 的 .. 是 claude-pty，
      # repo 根要再上一層（entrypoint.sh 在 <repo>/dev-container/）。
      - ../..:${HOST_REPO_ROOT:-/repo}:ro
      - ${CLAUDE_PTY_DATA_DIR:-./data}:/data   # 與 control 同一份 SQLite（見上方說明）
    environment:
      # ⚠ **與 control 同一份**（見檔頭 x-gitlab-env）。這一邊漏掉比 control 漏掉更糟：
      #   reconciler 是收斂代理的那一方，看不到 GITLAB_HOST 就會把每一顆代理判成該收。
      <<: *gitlab-env
      CLAUDE_PTY_HOST_HOME: ${HOME}
      CLAUDE_PTY_HOST_REPO_ROOT: ${HOST_REPO_ROOT:-/repo}
      CLAUDE_PTY_SELF_REPO_ROOT: ${HOST_REPO_ROOT:-/repo}
      CLAUDE_PTY_DB_PATH: /data/claude-pty.db
      CLAUDE_PTY_SECRET_KEY: ${CLAUDE_PTY_SECRET_KEY:?同上}
      # ⚠ 與 control 同值。reconciler 也讀 config.IMAGE（trivy DB 預熱、image 建立時間），
      #   只給一邊的話兩隻服務會對著不同的 image 做判斷。
      CLAUDE_PTY_IMAGE: ${CLAUDE_PTY_IMAGE:-ncr-dev-container}
    # ⚠ 預設的 json-file driver **沒有大小上限**。control 每個請求一行 access log、
    #   nginx 也有、reconciler 每 30 秒一輪，三者都 restart: unless-stopped——磁碟被吃滿時
    #   的症狀是 SQLite 寫入失敗，那個症狀完全指不到 log 檔（審查 F-017）。
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [claude-pty-net]
    depends_on: [control]
    restart: unless-stopped

  nginx:
    # ⚠ 從 `image: nginx:alpine` 改成 build，是因為 **Vue 版的產物要跟著 image 走版本**：
    #   `--target nginx` 的那一階段把 node 階段 build 出來的 dist COPY 進 /usr/share/nginx/html
    #   （見 deploy/Dockerfile）。base image 仍然是 nginx:alpine，只多了那一層 COPY。
    #   用 bind mount 的話，host 上沒 build 過的目錄會被 docker 建成空目錄頂替——症狀是整站
    #   404 而不是「你忘了 build」。
    # ⚠ legacy 模式下這一層只是躺著：頁面路由由下面掛進去的片段決定（預設是空的 legacy 版），
    #   `/assets/*` 沒有人會要。
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: nginx
    # 唯一對外發布 port 的服務（ADR 0005 單一入口）。ttyd 的 port 全在內部網路，不發布。
    # ⚠ **預設只綁 loopback**。這個站台是明文 HTTP（COOKIE_SECURE 預設 0）、沒有租戶隔離、
    #   而且能在 host 的 dockerd 上開特權容器；SSH agent 轉發開著時還多一把能認證任何主機
    #   的 key。要讓同網段連得到是**明確的部署決定**，在 deploy/.env 設 CLAUDE_PTY_BIND_ADDR
    #   （見 ADR 0013），不要直接把這一行改成 "8080:8080"——那樣改不會留下任何痕跡。
    ports:
      - "${CLAUDE_PTY_BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/claude-pty.conf:ro
      # 前端要用哪一版的頁面路由（`/`、`/login`、`/account`）。預設 legacy＝**空的片段**，
      # 三條路照舊 proxy 給 Flask。切 Vue 版：`CLAUDE_PTY_NGINX_UI=./nginx-ui/vue`。
      # ⚠ 要與 control 的 `CLAUDE_PTY_UI` 一起換（見 nginx-ui/legacy/ui.conf 的說明）。
      #   只換一邊的話兩條路會各說各話，而畫面上分不出來。
      - ${CLAUDE_PTY_NGINX_UI:-./nginx-ui/legacy}:/etc/nginx/claude-pty-ui:ro
    # ⚠ 預設的 json-file driver **沒有大小上限**。control 每個請求一行 access log、
    #   nginx 也有、reconciler 每 30 秒一輪，三者都 restart: unless-stopped——磁碟被吃滿時
    #   的症狀是 SQLite 寫入失敗，那個症狀完全指不到 log 檔（審查 F-017）。
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [claude-pty-net]
    depends_on: [control]
    restart: unless-stopped

volumes:
  # trivy 漏洞 DB 的共用快取（ADR 0018）。**固定名稱、不吃 compose 的 project 前綴**——
  # 人的路徑（dev-container/run-ncr-dev-container.sh）要掛得到同一顆，兩條路徑才共用得了
  # 那 ~1.2 GB。改名等於分家，兩邊各抓一份。
  # ⚠ 擁有者在**第一次被掛載時**就烙死了（從 image 的 /home/nathan/.cache/trivy 複製）。
  #   ⚠ volume **一旦有內容就不會再被初始化**，擁有者停在當初那個 uid。換 NCR_UID 之後
  #   要 `docker volume rm ncr-trivy-cache`，否則新 uid 寫不進舊 volume。
  trivy-cache:
    name: ncr-trivy-cache

networks:
  claude-pty-net:
    name: claude-pty-net

  # ⚠ **session 容器的網路刻意不宣告在這裡。** 它是 **per-user 的**（`claude-pty-user-{id}`，
  #   ADR 0016），開場時由控制平面 `user_proxy.ensure_network()` 建出來——開機時根本不知道
  #   等一下會有誰來開場，先建不了。而且 compose 只會建立「有服務引用到」的 network，
  #   沒有任何服務用它（用它的是控制平面另外起的 session 容器），宣告在這裡只會看起來
  #   有人負責，實際上不會被建出來（2026-07-29 實測）。
  #   ⚠ 這裡以前寫的是一張所有人共用的 `claude-pty-sessions`，由 `sessions.preflight`
  #     開機時確保它存在。那張網退役了（跨使用者在上面互通得到），preflight 現在**只在
  #     它還殘留時報一行叫人清掉**，不再建立任何共用網路。
  # ⚠ telemetry：jaeger 定義在 `opentelemetry/jaeger-compose.yaml`，它**不擁有也不借任何
  #   一張網**（`network_mode: bridge`——待在 docker 內建的預設橋接上，那張本來就存在、
  #   不佔位址池的配額）。**沒有開機順序要求**——先起誰都可以。
  #   規約是「需要 jaeger 的那一方負責把它接到自己的網上」，接線點見 `user_proxy.attach_jaeger`
  #   （網路剛建好時、控制平面啟動時、reconciler 每一輪各接一次）。
  #   ⚠ 這裡以前寫「jaeger 以 external 引用，所以要先起這個 stack 再起 jaeger」——那個
  #     開機順序陷阱正是後來要修掉的東西，別再照它做。
