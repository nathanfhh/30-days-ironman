# claude-pty nginx 設定（ADR 0005 單一入口 + 兩條路由、ADR 0008）
#
#   路由 A  /  /login  /account  /api/*   → Flask 控制平面
#   路由 B  /session/<id>/                → 先 auth_request 問 Flask，通過才 proxy 到該 view 的 ttyd
#
# 關鍵手法：ttyd 的 port 是**動態**的（on-demand view，由 DB 的 UNIQUE 仲裁分配），所以
# nginx 不能寫死 upstream。auth_request 讓 Flask 在授權的同時以 `X-Ttyd-Port` 回報該
# session 目前的 view port，再用 auth_request_set 取出、放進 proxy_pass 的變數——
# 單一入口與動態 port 因此同時成立，所有 ttyd 只綁 loopback、完全不對外曝露。
#
# 本檔放在 http{} context（例如 /etc/nginx/conf.d/claude-pty.conf）。
#
# ⚠ 改完這個檔如果 `nginx -t` 報的行號對不上你眼前的檔案，先
#   `docker compose up -d --force-recreate nginx` 再試，不要以為是自己寫錯。
#   2026-07-26 實際遇到：host 上 113 行，容器裡 `wc -l` 只有 98 行的截斷版，
#   `nginx -t` 因此報 unexpected end of file；重建容器後就正確了。
#   ⚠ 機制不明，**不要在這裡寫一個聽起來合理的解釋**。事後用 80 次
#     「改檔→立刻在容器內讀」的對照測試（單檔 mount / 目錄 mount、就地覆寫 / 寫暫存再
#     mv、等 0～2 秒）完全複現不出來，全部即時一致。所以它不是「單檔 mount 一定看不到
#     更新」，是偶發的一致性問題——重建容器是已知有效的處置，如此而已。
# 部署時 Flask 端需設 CLAUDE_PTY_BEHIND_PROXY=1（管理畫面才會用單一入口路徑開終端），
# 上 TLS 後再設 CLAUDE_PTY_COOKIE_SECURE=1。

# 控制平面的位置。容器化部署（ADR 0009）時是同一個 docker network 上的兄弟容器，
# 用服務名 `control`；nginx 直接跑在 host 時改成 127.0.0.1:8000。
# 注意：docker 的內建 DNS 需要 resolver 才能在「變數化的 proxy_pass」中解析主機名，
# 但 upstream 區塊是啟動時解析一次，故此處用服務名沒問題。
# 登入限流：/api/auth/login 是公開端點，每次都要跑一次昂貴的 argon2 驗證，
# 不限流會被平行的錯密碼請求打爆 CPU、餓死其他請求（review H5）。
limit_req_zone $binary_remote_addr zone=claude_pty_login:1m rate=10r/m;

upstream claude_pty_control {
    server control:8000;
    keepalive 16;
}

server {
    listen 8080;
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/ssl/certs/claude-pty.crt;
    # ssl_certificate_key /etc/ssl/private/claude-pty.key;
    server_name _;

    # 終端會傳大量 ANSI 重繪；關掉緩衝才不會有延遲感
    proxy_buffering off;
    proxy_read_timeout 12h;      # 終端長時間無資料是常態，別讓 nginx 掐斷連線
    proxy_send_timeout 12h;
    client_max_body_size 4m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 登入端點單獨限流（burst 允許短暫連打，nodelay 讓正常使用者不被排隊延遲）
    location = /api/auth/login {
        limit_req zone=claude_pty_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://claude_pty_control;
    }

    # `/api/auth/view` 只該由下面的 auth_request 子請求打，外部沒有任何理由碰它：
    # 它會回報該 session 目前的**內部 ttyd port**，而且有副作用——沒有存活的 view 時
    # 會當場開一個（見 app.py 的 auth_view）。擋在這裡就好，不必動 Flask：
    # `location = /_auth_view` 是 proxy_pass 到 upstream，不會再走一次 location 比對，
    # 所以子請求不受影響（下面那條路由驗得到）。
    # 回 404 不回 403：403 等於承認「有這支端點、只是不給你」。
    location = /api/auth/view { return 404; }

    # `/api/auth/check` 同理對外擋掉。它是 ttyd-rust `--auth-url` 的掛載點（第二層
    # 授權：ttyd 自己在放行前再問一次控制平面，與上面的 auth_request 是縱深不是重複）
    # ——ttyd 與控制平面同容器，走 loopback 直達，根本不經過 nginx，擋在這裡零成本。
    location = /api/auth/check { return 404; }

    # 檔案上傳（貼圖）是唯一的大 body 端點：body 上限放寬在**這一條**而不是全站
    # （全站的 4m 維持不動——其他端點都是 JSON，放寬只是多開攻擊面）。
    # ⚠ 這個值要**略大於** Flask 端的 CLAUDE_PTY_UPLOAD_MAX_BYTES（預設 10 MB）＋
    #   multipart 開銷：nginx 先擋的話，使用者看到的是 nginx 的 413 HTML 頁，
    #   不是控制平面講得清楚的 JSON。
    location ~ ^/api/sessions/[A-Za-z0-9]+/upload$ {
        client_max_body_size 12m;
        proxy_pass http://claude_pty_control;
    }

    # ── Vue 版（階段 4）：SPA 的產物由 nginx 直出 ───────────────────────────────
    #
    # `/assets/` 是 Vite 的產物，**檔名帶內容雜湊**，所以可以放心快取一年：改版就換檔名，
    # 不需要任何人按 Cmd+Shift+R（同 web.asset_url 的版本戳，只是這裡由 build 工具做）。
    # ⚠ 這條在 legacy 模式下也留著：legacy 從來不要求 `/assets/*`，所以它不改變任何行為；
    #   而把它做成「跟著 UI 切換」等於多一個會忘記一起改的旋鈕。
    # ⚠ dist 怎麼進到這個容器：node 階段 build 完 COPY 進 nginx image（deploy/Dockerfile 的
    #   `nginx` target），不是 bind mount——mount 的話 host 上沒 build 就會被 docker 建成一個
    #   空目錄頂替，症狀是整站 404 而不是「你忘了 build」。
    # ⚠ `expires` 與 `add_header Cache-Control` **不可以並用**：`expires 1y` 自己就會送一個
    #   `Cache-Control: max-age=31536000`，再 add_header 一條就是**同一個標頭回兩份**。
    #   瀏覽器怎麼合併是實作決定的，中間的快取更難說——一個值得快取一年的資源不該讓
    #   「到底聽哪一份」變成一個問題。合成一條寫清楚。
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 頁面路由（`/`、`/login`、`/account`）依前端版本而定，**放在外部檔案**：
    #   legacy → 空的（落到下面的 `location /`，proxy 給 Flask，行為一個字不變）
    #   vue    → 三條 `try_files $uri /index.html`
    # 掛哪一個由 compose 的 `CLAUDE_PTY_NGINX_UI` 決定（見 deploy/nginx-ui/）。
    # ⚠ 不寫死在這個檔裡：預設是 legacy（計畫的決定 3），而 nginx 讀不到 Flask 那邊的
    #   `CLAUDE_PTY_UI`——直接把 try_files 放進來的話，正式站在 legacy 模式下也會吐 SPA。
    # ⚠ glob 沒命中不是錯誤，所以「目錄不存在／裡面沒有 .conf」等同 legacy。
    include /etc/nginx/claude-pty-ui/*.conf;

    # ── 路由 A：控制平面（管理畫面 + API）──────────────────────────────────────
    location / {
        proxy_pass http://claude_pty_control;
    }

    # ── 路由 B：終端（on-demand ttyd）─────────────────────────────────────────
    # 內部子請求：Flask 驗 cookie（authn）+ 擁有權（authz），通過回 200 + X-Ttyd-Port
    location = /_auth_view {
        internal;
        proxy_pass http://claude_pty_control/api/auth/view?session=$claude_pty_session_id;
        proxy_pass_request_body off;          # 子請求不需要 body
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location ~ ^/session/(?<claude_pty_sid>[A-Za-z0-9]+)/ {
        # ⚠ 必須在**父請求**就把 session id 求值並快取，子請求才看得到（2026-07-25 實測）。
        #   先前用 `map $uri` 失敗：map 是延遲求值，第一次被讀取是在 /_auth_view 子請求內，
        #   那時 $uri 已經是子請求自己的 URI，map 落空 → Flask 收到 `session=` → 一律 403。
        #   subrequest 與父請求共用變數快取，故在此 set 即可讓子請求取得正確值。
        set $claude_pty_session_id $claude_pty_sid;
        auth_request /_auth_view;
        # 取出子請求回報的 port，供下面的 proxy_pass 當變數用
        auth_request_set $ttyd_port $upstream_http_x_ttyd_port;

        # 未授權 / 該 session 目前沒有存活的 view → 導回管理畫面，不露出 403 裸頁
        # ⚠ **5xx 也要接。** auth_request 只對 2xx / 401 / 403 有定義，其餘一律 5xx，
        #   而只列 401 403 的話那些接不到——使用者看到的是 nginx 的裸錯誤頁，而抽屜的
        #   load handler 判準是「還在不在 /session/ 底下」，錯誤頁沒有導走，於是它把那頁
        #   當成終端顯示（審查 F-012）。兩條真實路徑：control 不在（redeploy 每次都製造
        #   這個窗口），以及 X-Ttyd-Port 空或缺 → `proxy_pass http://control:` 是 invalid port。
        error_page 401 403 500 502 503 504 = @view_denied;

        # ttyd 跑在 control 容器內、綁 0.0.0.0（ADR 0009），port 由上面的子請求動態決定。
        # ⚠ proxy_pass 一旦含變數，nginx 就改為「執行期解析」，必須提供 resolver——
        #   127.0.0.11 是 docker 內建 DNS。（nginx 直接跑在 host 時：把 $ttyd_upstream
        #   改成 127.0.0.1 並可移除 resolver，因為那是字面 IP。）
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ttyd_upstream control;
        proxy_pass http://$ttyd_upstream:$ttyd_port;

        # ⚠ 這裡**只能是 'self'，不可以是 DENY / 'none'**。管理畫面的終端抽屜是用
        #   same-origin iframe 嵌這條路徑的，擋掉同源等於抽屜變成一片空白——而且只有
        #   console 有錯，沒有任何測試會紅。Flask 那邊全站的 `X-Frame-Options: DENY`
        #   之所以不影響，正是因為這條不經 Flask。
        #   `frame-ancestors 'self'` 允許同源、擋掉跨來源，正好是這裡要的形狀。
        #   （SameSite=Lax 已經讓跨來源嵌入拿不到 cookie → auth_request 失敗 → 302，
        #     所以這是多一層縱深，不是在補一個現行漏洞。）
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # ttyd 走 WebSocket，必須升級協定
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location @view_denied {
        return 302 /;
    }
}
