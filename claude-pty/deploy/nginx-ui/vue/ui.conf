# 前端＝Vue SPA。三條頁面路由由 nginx 直接吐 `index.html`，不經 Flask。
#
# ⚠ 用 `location =`（精確比對）而不是前綴：`location /` 那條要留給 `/api/*` 以外的一切
#   （`/static/*` 的字體與圖示仍由 Flask 供應）。前綴比對會把它們一起吃掉，症狀是字體與
#   Font Awesome 全部 404、版面看起來「壞了但說不出哪裡壞」。
#
# ⚠ **`try_files $uri /index.html;` 是錯的，而且是會讓三個頁面全部 404 的那種錯。**
#   try_files 的最後一個參數若是 URI，nginx 會做**內部轉向**——它把 `/index.html` 當成一個
#   新的請求重新跑一次 location 比對，而 `/index.html` 不符合上面三條精確比對，於是落到
#   `location /` 被 proxy 給 Flask，Flask 沒有這條路由 → 404。
#   正解是讓最後一個參數是 `=404`：這樣前面的 `/index.html` 是**檔案路徑**（相對 root），
#   命中就直接送檔，完全不重新比對。
#   （另一種寫法是替 `/index.html` 開一條 `internal` 的 location 收那個內部轉向。兩種都行，
#     這裡選不轉向的那一種：少一次比對，也少一個「誰接住它」的問題。）
#
# ⚠ 殼**不可以被快取**（`no-store`）：改版後 index.html 指的是新的 /assets/*.js，拿到舊
#   的殼會去要一個已經不存在的檔案——那是一片白畫面，沒有任何線索。
#   `/assets/` 反過來可以長期快取，因為 Vite 把內容雜湊寫進檔名（見 nginx.conf）。
#
# ⚠ 安全標頭要**自己補一份**，值逐字照 `server/app.py` 的 `_security_headers`。這三條路
#   不經 Flask，所以那支 after_request 完全沒有機會跑——不補的話，切到 vue 版等於把 CSP、
#   nosniff、Referrer-Policy、X-Frame-Options 一起關掉，而畫面上完全看不出來。
#   ⚠ `always`：`add_header` 預設只對 2xx/3xx 生效，錯誤回應（例如 =404）就沒有標頭。
location = / {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files /index.html =404;
}

location = /login {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files /index.html =404;
}

location = /account {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files /index.html =404;
}
