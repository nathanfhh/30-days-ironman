# 前端＝legacy（Jinja 模板 + static/js/app.js）。**這個檔刻意沒有任何指令。**
#
# `/`、`/login`、`/account` 因此落到 nginx.conf 的 `location /`，一律 proxy 給 Flask，
# 與 Vue 版上線之前一模一樣——切換器只加新的分支，不動舊的那一條。
#
# 要切成 Vue 版：deploy/.env 設 `CLAUDE_PTY_NGINX_UI=./nginx-ui/vue`（掛給 nginx 的是
# 哪一個目錄），並把 control 的 `CLAUDE_PTY_UI` 也設成 vue（dev 與 e2e 走 Flask 那條路）。
# 兩邊要一起換：只換 nginx 的話 SPA 拿得到殼，但 Flask 的 `/` 還在吐舊模板；只換 Flask
# 的話正式站的頁面路由仍然回舊模板。
