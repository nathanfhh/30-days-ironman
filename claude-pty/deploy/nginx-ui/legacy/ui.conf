# 前端＝legacy（Jinja 模板 + static/js/app.js）。**這個檔刻意沒有任何指令。**
#
# `/`、`/login`、`/account` 因此落到 nginx.conf 的 `location /`，一律 proxy 給 Flask，
# 與 Vue 版上線之前一模一樣——切換器只加新的分支，不動舊的那一條。
#
# 要切成 Vue 版：deploy/.env 設 `CLAUDE_PTY_UI=vue`。**一個變數管兩端**——compose 掛給
# nginx 的目錄名就是這個值（`./nginx-ui/${CLAUDE_PTY_UI}`），而 control 也讀同一個變數，
# 所以不會出現「只換了一邊」那種兩條路各說各話的狀態。
