# The whole suite is offline by design: HTTP goes to an in-process stub server,
# linters are fake executables planted on PATH, and every dataset is synthetic.
# No docker daemon, no real GitLab, no network beyond package installation.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Version pinned so a ruff release can't flip this gate red on its own;
      # config lives in pyproject.toml (root + claude-pty), resolved per directory.
      - run: uvx ruff@0.16.3 check .
      - run: uv sync --locked
      - run: uv run pytest

  claude-pty:
    # quick 模式：跳過所有會真的起容器的整合測試，不需要 image，約一分鐘。
    # ⚠ 這個 job 存在的理由寫在 run-all.sh 的檔頭：測試寫得再好，沒有機制保證它們被跑過
    #   就等於少了一半。在它之前，claude-pty 那 11,000 行測試沒有任何自動觸發。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # app.js 的語法檢查要 node；沒有的話 run-all.sh 會跳過它並講出來，但那一關壞掉時
      # 症狀是「每支瀏覽器測試都停在登入逾時」，不該讓它在 CI 上缺席。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./tests/run-all.sh
        working-directory: claude-pty

  dev-container:
    # build image ＋ 全套（含那 13 支要 docker 的）。
    # ⚠ 這裡的 image 是從當下的原始碼現 build 的，所以「image 比它的原始碼還舊」在 CI 上
    #   結構性不可能發生——那正是 2026-08-15 在開發機上撞到的坑：image 停在 8/05，
    #   entrypoint.sh 已經多了 500 行，而測試驗的是原始碼。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # ⚠ install: true 把 `docker build` 換成 buildx，build.sh 才吃得到 --cache-from。
      #   不改用 build-push-action，是因為「Linux 才帶 NCR_UID」那段判斷只寫在 build.sh
      #   裡；重寫一份等於讓兩條路分家，而分家的那天不會有人發現。
      - uses: docker/setup-buildx-action@v3
        with:
          install: true
      # Dockerfile 把貴的工具安裝排在前面、COPY entrypoint.sh 排在最後幾層，所以改
      # entrypoint 只會讓尾巴失效：有 cache 的重建是分鐘級，不是十幾分鐘。
      - name: build ncr-dev-container
        run: ./build.sh --load --cache-from type=gha --cache-to type=gha,mode=max
        working-directory: dev-container
      # ⚠ 代理那顆 image 是產品**假設它已經在**的前提：`user_proxy` 建容器時不會自己拉，
      #   缺的時候是一句 `404 Client Error ... No such image` 從 docker SDK 拋出來，
      #   完全指不到「你少了一顆 image」。開發機上它通常早就在了（跑過正式 stack），
      #   乾淨的機器上不會——CI 是第一個誠實回答這件事的地方。名字從 config 讀，
      #   免得哪天改了 PROXY_IMAGE 這裡還在拉舊的。
      - name: 預拉代理 image
        working-directory: claude-pty
        run: |
          img=$(uv run --with flask --with sqlalchemy --with argon2-cffi --with docker \
                       --with psutil --with cryptography \
                       python -c "import sys; sys.path.insert(0, '.'); from server import config; print(config.PROXY_IMAGE)")
          echo "代理 image：${img}"
          docker pull "${img}"
      # `test_ro_socket_mount` 用一顆現成的小 image 當 socket 的兩端（server 掛 rw、
      # client 掛 ro）。與代理 image 同一個做法：**由 workflow 預拉，測試缺了就紅**。
      # ⚠ 這一步是 2026-08-22 補的。在它之前那支測試自己 `print("SKIP"); exit(0)`，
      #   run-all.sh 於是把它算成「跑過」、不進跳過清單，下面那道「跳過上限 1」的 gate
      #   完全看不到它——chmod／mode 兩條斷言從來沒有在 CI 上跑過，而畫面是綠的
      #   （run 32579472171 的 log 就是證據）。
      - name: 預拉 test_ro_socket_mount 用的 image
        run: docker pull python:3.13-slim
      # 兩支測試會在 host 上真的把 ttyd 生出來（不是在容器裡跑）。裝的是 C 版，因為
      # TTYD_BIN_DEFAULT 就是它——Rust 那顆是可選的第二顆，要驗 --auth-url 那層才需要。
      # ⚠ 版本與雜湊一律從 deploy/Dockerfile 讀，不在這裡抄一份：抄一份的那天，CI 驗的
      #   就不是部署真的在跑的那一顆了。抽不到值直接失敗——不可以退化成「沒驗雜湊照樣裝」，
      #   那正是 Dockerfile 那段註解在防的事（雜湊進版控，不從同一個位置抓答案）。
      # ⚠ 先驗再裝：驗過才放進 PATH，中間不存在「可執行但還沒驗」的那一刻。
      - name: ttyd（C 版，與 deploy/Dockerfile 同一份版本與雜湊）
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^ARG TTYD_VERSION=\(.*\)$/\1/p' claude-pty/deploy/Dockerfile | head -1)
          sha=$(sed -n 's/^ARG TTYD_SHA256_AMD64=\(.*\)$/\1/p' claude-pty/deploy/Dockerfile | head -1)
          if [ -z "${ver}" ] || [ -z "${sha}" ]; then
            echo "::error::從 deploy/Dockerfile 抽不到 TTYD_VERSION／TTYD_SHA256_AMD64（ARG 改名了？）"
            exit 1
          fi
          echo "ttyd ${ver}  sha256 ${sha}"
          curl -fsSL "https://github.com/tsl0922/ttyd/releases/download/${ver}/ttyd.x86_64" -o /tmp/ttyd
          echo "${sha}  /tmp/ttyd" | sha256sum --check --strict -
          sudo install -m 0755 /tmp/ttyd /usr/local/bin/ttyd
          ttyd --version
      - name: playwright 瀏覽器
        # 版本要跟 run-all.sh 問到的那顆一致——它問的是 playwright 自己要哪一個 build，
        # 不是看快取目錄在不在（快取裡留著舊 build 是常態）。
        run: uv run --with playwright python -m playwright install --with-deps chromium-headless-shell
      - name: 全套測試
        working-directory: claude-pty
        run: |
          set -o pipefail
          ./tests/run-all.sh --all 2>&1 | tee /tmp/pty-all.log
      - name: 跳過清單必須只剩已知的那些
        # ⚠ 「安靜地跳過」在 CI 上跟「跑過而且過了」長得一模一樣，這是假綠燈第一種形狀。
        #   Linux runner 上不該再有平台性跳過（uid 鏈、ssh-agent socket 在這裡是驗得到的），
        #   image 也剛 build 過，ttyd 與 playwright 也裝了。**預期只剩一支**：沒有 claude
        #   憑證的 test_entrypoint_human_path——憑證不該進 CI，那條路只能在有登入的機器上驗。
        working-directory: claude-pty
        run: |
          n=$(sed -n 's/^跳過 \([0-9]*\) 支.*/\1/p' /tmp/pty-all.log)
          n=${n:-0}
          echo "跳過 ${n} 支（預期上限 1：claude 憑證）"
          if [ "${n}" -gt 1 ]; then
            sed -n '/^跳過/,$p' /tmp/pty-all.log
            echo "::error::跳過的數量超出預期——CI 上的跳過幾乎都是設定漏了，不是正當的環境限制"
            exit 1
          fi
          # ⚠ 上面那個數字**只數 run-all.sh 自己跳掉的**。測試在自己內部 print 一行 SKIP
          #   再 exit 0 的話，這道 gate 完全看不到——那道檢查在 `run-all.sh` 的 `run_one`
          #   裡（「空跑：exit 0，但一條 PASS/FAIL 都沒印出來」），放那裡是因為它知道剛跑的
          #   是哪一支，不必從 log 猜區塊標題的形狀，而且本機跑 `--all` 也吃得到。
